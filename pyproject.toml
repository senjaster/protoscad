[project]
name = "manifold-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ars.biryukov", email = "ars.biryukov@tbank.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "click>=8.5.0",
    "manifold3d>=3.5.4",
    "pyglet<2",
    "trimesh[easy]>=5.1.1",
]

[project.scripts]
manifold-learn = "manifold_learn:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
exclude = ["src/manifold_learn/grammar/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
exclude = ["src/manifold_learn/grammar/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["manifold3d", "antlr4", "antlr4.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["src/manifold_learn/grammar/*"]

[tool.pytest.ini_options]
addopts = "--cov=manifold_learn --cov-report=term-missing"
testpaths = ["tests"]
