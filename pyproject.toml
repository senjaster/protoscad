[project]
name = "manifold-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ars.biryukov", email = "ars.biryukov@tbank.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "manifold3d>=3.5.4",
    "trimesh>=5.1.1",
]

[project.scripts]
manifold-learn = "manifold_learn:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "pytest>=9.1.1",
]
